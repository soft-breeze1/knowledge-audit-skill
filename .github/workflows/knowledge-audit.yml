name: knowledge-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 校验 SKILL.md 与两个发现目录一致
        run: python scripts/sync_skill.py --check

      - name: 用内置演示语料跑完整流水线
        run: python scripts/run_all.py input/

      - name: 校验交付文件数量（2 HTML + 2 XLSX）
        run: python scripts/check_deliverables.py

      - name: 上传报告（便于在 Actions 页面直接下载查看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-audit-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/*/
          if-no-files-found: warn